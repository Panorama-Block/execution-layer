name: Deploy Execution Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-execution-service.yml'

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Compute execution-service image
        id: image
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image_sha=ghcr.io/${OWNER_LOWER}/execution-service:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/${OWNER_LOWER}/execution-service:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push execution-service image
        env:
          IMAGE_SHA: ${{ steps.image.outputs.image_sha }}
          IMAGE_LATEST: ${{ steps.image.outputs.image_latest }}
        run: |
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" ./backend
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Publish image reference summary
        run: |
          {
            echo "## execution-service image"
            echo
            echo "- immutable tag: \`${{ steps.image.outputs.image_sha }}\`"
            echo "- latest tag: \`${{ steps.image.outputs.image_latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
